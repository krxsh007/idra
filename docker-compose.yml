services:
  db:
    image: postgis/postgis:16-3.4
    container_name: idra_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: idra
      POSTGRES_USER: idra
      POSTGRES_PASSWORD: idra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idra -d idra"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: idra_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://idra:idra@db:5432/idra
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      - ./artifacts:/artifacts
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: idra_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    depends_on:
      - api

volumes:
  pgdata:
